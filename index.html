
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<title>JD AI Voice Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
<h1>JD AI</h1>
<p class="sub">YOUR PERSONAL VOICE ASSISTANT</p>

<div class="orb" id="mic">🎙️</div>

<h3 id="message">TAP TO START</h3>

<div class="status" id="status">
Assistant Ready
</div>

<div class="panel">
<h3>⚙️ Settings</h3>

<input id="apikey" type="password"
placeholder="Enter AI API Key">

<select id="language">
<option value="hi-IN">Hindi</option>
<option value="en-IN">English</option>
</select>

<button id="save">SAVE SETTINGS</button>

<p class="small">JD AI Assistant • Android Edition</p>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
